<title>Vosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Vosa — light mode. White with a light-green signature; one deep green for actions. */
:root {
  --bg: #FFFFFF;
  --surface: #F5F7F6;      /* inputs, list wells */
  --tint: #FFEDE1;         /* light orange: avatar, highlights */
  --green: #1F9D55; --green-bg: #E8F6E5; /* light green: savings and money-in */
  --tint-2: #FFE3D3;       /* text on the orange card */
  --brand: #1F9D55;        /* icons, progress (light green) */
  --primary: #CC4A0A;      /* Paga-style orange: buttons and the balance card (4.6:1 with white) */
  --ink: #0E1B14;
  --text2: #5F6E65;        /* secondary text (5.4:1) */
  --line: #EBEFEC;
  --danger: #C2362B; --danger-bg: #FDEEEC;
  --warn: #965A00; --warn-bg: #FFF4E0;
  --font: "Plus Jakarta Sans", "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-yo: "Noto Sans", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #EEF1EF; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
:root[lang="yo"] body { font-family: var(--font-yo); line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

.app { position: relative; height: 100%; max-width: 440px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 480px) { .app { box-shadow: 0 0 0 1px var(--line); } }
.views { flex: 1; overflow-y: auto; }
.view { display: flex; flex-direction: column; padding: 0 20px 24px; }

/* Voice Promise waveform */
.pwave { display: flex; align-items: center; justify-content: center; gap: 5px; height: 44px; }
.pwave i { width: 6px; height: 10px; border-radius: 3px; background: var(--tint-2); transition: height .2s; }
.pwave.live i { background: var(--primary); animation: pw 1s ease-in-out infinite; }
.pwave.live i:nth-child(2) { animation-delay: .1s; } .pwave.live i:nth-child(3) { animation-delay: .2s; } .pwave.live i:nth-child(4) { animation-delay: .3s; }
.pwave.live i:nth-child(5) { animation-delay: .4s; } .pwave.live i:nth-child(6) { animation-delay: .5s; } .pwave.live i:nth-child(7) { animation-delay: .6s; }
@keyframes pw { 0%, 100% { height: 10px; } 50% { height: 38px; } }
@media (prefers-reduced-motion: reduce) { .pwave.live i { animation: none; height: 24px; } }

/* page header */
.hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 12px; }
.hd-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--tint); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: 0 0 auto; }
.hi { font-size: 18px; font-weight: 700; line-height: 1.25; margin: 0; }
.hi-sub { font-size: 14px; color: var(--text2); margin: 0; }
.hd-actions { display: flex; gap: 8px; }
.iconbtn { height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink); }
.iconbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.title { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }

/* balance card */
.bal { background: var(--primary); color: #fff; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.bal-top { display: flex; justify-content: space-between; align-items: center; }
.bal-lbl { font-size: 14px; color: var(--tint-2); font-weight: 500; }
.eye { border: 0; background: rgba(255,255,255,.12); color: #fff; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.bal-amt { font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
.bal-amt small { font-size: 18px; font-weight: 700; color: var(--tint-2); }
.bal-row { display: flex; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.16); font-size: 14px; }
.bal-row span { color: var(--tint-2); display: block; }
.bal-row b { font-size: 16px; font-weight: 700; }
.bal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.bal-tags span { font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.14); border-radius: 6px; padding: 3px 8px; }

/* quick actions */
.qa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 20px; }
.qa button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); padding: 0; min-height: 76px; }
.qa .tile { width: 52px; height: 52px; border-radius: 16px; background: var(--tint); color: var(--primary); display: grid; place-items: center; }

/* voice card */
.voice { margin-top: 20px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); text-align: left; width: 100%; }
.voice .vm { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; flex: 0 0 auto; }
.voice b { display: block; font-size: 15px; }
.voice > div > span { font-size: 14px; color: var(--text2); }
.voice .chev { margin-left: auto; color: var(--text2); flex: 0 0 auto; }

/* sections + lists */
.sec { margin-top: 28px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.sec-h h2 { margin: 0; font-size: 17px; font-weight: 700; }
.more { border: 0; background: none; color: var(--primary); font-weight: 700; font-size: 14px; padding: 10px 0 10px 12px; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.row:last-child { border-bottom: 0; }
.gtile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; font-weight: 800; font-size: 16px; }
.row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.row .mid b { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.row .mid span { font-size: 13.5px; color: var(--text2); }
.row .end { text-align: right; flex: 0 0 auto; }
.row .end b { display: block; font-size: 15px; font-weight: 700; }
.row .end span { font-size: 13px; color: var(--text2); }
.row .end .in { color: var(--primary); }
.bar { height: 6px; border-radius: 999px; background: var(--surface); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .5s ease; }
.pill-s { display: inline-block; white-space: nowrap; font-size: 12.5px; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: var(--tint); color: var(--primary); }
.pill-s.behind { background: var(--warn-bg); color: var(--warn); }
.empty { color: var(--text2); font-size: 14px; padding: 12px 0; margin: 0; }
.flash { animation: flash 1.2s ease; }
@keyframes flash { from { background: var(--tint); } to { background: transparent; } }
.day { margin: 18px 0 0; font-size: 13px; font-weight: 700; color: var(--text2); }
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.summary div { background: var(--surface); border-radius: 14px; padding: 14px; }
.summary span { display: block; font-size: 13px; color: var(--text2); }
.summary b { font-size: 18px; font-weight: 800; }

/* settings */
.group { margin-top: 20px; border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; }
.group-t { margin: 24px 0 8px; font-size: 13px; font-weight: 700; color: var(--text2); }
.set { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; border-bottom: 1px solid var(--line); padding: 10px 0; }
.set:last-child { border-bottom: 0; }
.set b { display: block; font-size: 15px; font-weight: 600; }
.set .d { font-size: 13.5px; color: var(--text2); }
.seg { display: inline-flex; background: var(--surface); border-radius: 10px; padding: 3px; flex: 0 0 auto; }
.seg button { min-height: 36px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: none; font-weight: 600; font-size: 13.5px; color: var(--text2); }
.seg button[aria-checked="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(14,27,20,.12); }
.sw { border: 0; background: none; padding: 6px 0; flex: 0 0 auto; }
.sw i { width: 46px; height: 28px; border-radius: 999px; background: #C9D2CD; position: relative; display: block; transition: background .15s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.sw[aria-checked="true"] i { background: var(--primary); }
.sw[aria-checked="true"] i::after { left: 21px; }
.link { border: 0; background: none; color: var(--primary); font-weight: 700; font-size: 14px; padding: 8px 0; }

/* reply bar + dock */
.replybar { display: flex; align-items: center; gap: 10px; margin: 0 12px 8px; padding: 10px 10px 10px 12px; border-radius: 14px; background: var(--ink); color: #fff; }
.replybar[hidden] { display: none; }
.replybar .vmk { flex: 0 0 auto; }
.replybar p { margin: 0; flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.replybar button { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; border: 0; background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; }
.dock { display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: end; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; border: 0; background: none; font-size: 12px; font-weight: 600; color: var(--text2); }
.tab[aria-current="page"] { color: var(--primary); }
.mic-wrap { display: flex; justify-content: center; margin-top: -26px; }
.mic { width: 64px; height: 64px; border-radius: 50%; border: 4px solid var(--bg); background: var(--primary); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(204,74,10,.30); }

/* buttons */
.btn { min-height: 54px; border-radius: 14px; border: 0; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; width: 100%; }
.btn.p { background: var(--primary); color: #fff; }
.btn.s { background: var(--surface); color: var(--ink); }
.btn.o { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.btn.d { background: var(--danger-bg); color: var(--danger); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* overlays */
.ov { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg); }
.ov.sheet { background: rgba(14,27,20,.42); justify-content: flex-end; overflow: hidden; }
.sh { background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; max-height: 92%; overflow-y: auto; }
.grab { width: 40px; height: 4px; border-radius: 999px; background: #D7DDD9; align-self: center; margin-bottom: 4px; }
.sh-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sh-h h2 { margin: 0; font-size: 18px; font-weight: 800; }
.x { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface); display: grid; place-items: center; flex: 0 0 auto; }
.heard { margin: 0; font-size: 13.5px; color: var(--text2); }
.heard b { color: var(--ink); font-weight: 600; }
.vsay { display: flex; gap: 10px; align-items: flex-start; background: var(--tint); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
.vsay p { margin: 0; flex: 1; }
.vsay button { flex: 0 0 auto; border: 0; background: none; color: var(--primary); padding: 0; height: 24px; }
.big-amt { text-align: center; padding: 6px 0 2px; }
.big-amt span { display: block; font-size: 13.5px; color: var(--text2); font-weight: 600; }
.big-amt b { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; }
.kv { border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
.kv div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.kv div:last-child { border-bottom: 0; }
.kv span { color: var(--text2); }
.kv b { font-weight: 700; text-align: right; }
.lockrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); font-size: 14.5px; }
.lockrow .lk { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: #fff; display: grid; place-items: center; flex: 0 0 auto; }
.lockrow b { display: block; }
.lockrow > div > span { color: var(--text2); font-size: 13.5px; }
.digits { display: flex; gap: 8px; justify-content: center; }
.lockrow .digits span { width: 48px; height: 56px; border-radius: 12px; background: var(--bg); border: 1px solid #D5DCD8; display: grid; place-items: center; font-size: 26px; font-weight: 800; color: var(--primary); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.lockrow .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--primary); background: var(--tint); border-radius: 999px; padding: 4px 10px; border: 0; }
.lockrow .chk.off { color: var(--text2); background: var(--bg); border: 1px dashed #B9C4BE; }
.tries { font-size: 13.5px; font-weight: 700; color: var(--danger); margin: 0; }
.field { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid #D5DCD8; background: var(--bg); padding: 0 14px; font-size: 16px; }
.field:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.inrow { display: flex; gap: 8px; }
.inrow .field { flex: 1; min-width: 0; }
.inrow .btn { width: auto; }
.lbl { font-size: 13.5px; font-weight: 600; color: var(--text2); margin: 0 0 6px; display: block; }
.choice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choice.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opt { min-height: 46px; border-radius: 12px; border: 1px solid #D5DCD8; background: var(--bg); font-weight: 600; font-size: 14px; padding: 0 6px; }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--primary); background: var(--tint); color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.calc { background: var(--tint); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--text2); }
.calc b { color: var(--ink); font-size: 20px; font-weight: 800; }
.ct { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; font-size: 13px; font-weight: 600; padding: 0; }
.ct .av { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; color: var(--ink); box-shadow: inset 0 0 0 2px transparent; }
.ct[aria-checked="true"] .av { background: var(--tint); color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }
.ex { display: flex; align-items: center; gap: 12px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; font-size: 15px; }
.ex:last-child { border-bottom: 0; }
.ex .ei { color: var(--brand); flex: 0 0 auto; }

/* full-screen pages (success, money in, onboarding, forms) */
.pg { flex: 1; display: flex; flex-direction: column; padding: 0 20px; }
.pg-h { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
.back { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface); display: grid; place-items: center; flex: 0 0 auto; }
.pg-h h1 { margin: 0; font-size: 18px; font-weight: 800; }
.pg-body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-bottom: 16px; }
.pg-foot { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 calc(20px + env(safe-area-inset-bottom, 0px)); }
.done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 48px 0 8px; }
.done .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--tint); color: var(--primary); display: grid; place-items: center; margin-bottom: 10px; }
.done h1 { margin: 0; font-size: 20px; font-weight: 800; }
.done .amt { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.nudge { border-radius: 16px; background: var(--tint); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.nudge p { margin: 0; font-weight: 600; }
.brand-row { display: flex; align-items: center; gap: 10px; }
.wordmark { font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
.lang-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid #D5DCD8; background: var(--bg); width: 100%; text-align: left; }
.lang-row b { display: block; font-size: 16px; }
.lang-row span { font-size: 13.5px; color: var(--text2); }
.lang-row[aria-checked="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--tint); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #B9C4BE; flex: 0 0 auto; }
[aria-checked="true"] > .radio { border: 7px solid var(--primary); }

/* listening sheet */
.listen { position: absolute; inset: 0; z-index: 30; background: rgba(14,27,20,.42); display: flex; flex-direction: column; justify-content: flex-end; }
.listen[hidden] { display: none; }
.lsh { background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.lsh-h { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.lstate { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--primary); }
.lstate i { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: block; }
.wave { display: flex; align-items: center; justify-content: center; gap: 5px; height: 64px; }
.wave i { display: block; width: 5px; border-radius: 999px; background: var(--brand); }
@media (prefers-reduced-motion: no-preference) {
  .wave i { animation: w .9s ease-in-out infinite alternate; }
  .wave i:nth-child(2n) { animation-delay: .15s; } .wave i:nth-child(3n) { animation-delay: .35s; }
  .wave.calm i { animation: none; transform: scaleY(.3); }
}
@keyframes w { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.live { min-height: 60px; font-size: 20px; font-weight: 700; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.stop { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; }
.lhint { margin: 0; font-size: 13.5px; color: var(--text2); }
@media (prefers-reduced-motion: reduce) { .flash, .bar i { animation: none; transition: none; } }
/* Trusted Circle */
.hp-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 4px 10px; align-self: flex-start; }
.hp-req { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 12px; }
.hp-req.live { border: 2px solid var(--primary); background: #FAFDF9; }
.hp-tag { font-size: 13px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: .04em; }
.hp-amt { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.hp-req .d, .hp-notif .d { font-size: 13px; color: var(--text2); }
.hp-notif { display: flex; flex-direction: column; gap: 10px; border-radius: 16px; padding: 14px; background: var(--ink); color: #fff; }
.hp-notif-h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #B9C9BF; text-transform: uppercase; letter-spacing: .04em; }
.hp-notif .d { color: #B9C9BF; }
.hp-notif .btn.d { background: rgba(255,255,255,.14); color: #fff; }
.dots { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); display: block; opacity: .35; }
@media (prefers-reduced-motion: no-preference) { .dots i { animation: dot 1.2s infinite; } .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; } }
@keyframes dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
/* ---- Bank-app layout (white cards on a soft grey page) ---- */
:root { --page: #F1F4F2; }
body { background: #E6EAE8; }
.app { background: var(--page); }
.view { padding: 0 12px 24px; }
.view .hd { padding: 16px 4px 10px; }
.card { background: var(--bg); border-radius: 20px; padding: 16px; margin-top: 10px; display: block; width: 100%; border: 0; text-align: left; }
.card.top { margin-top: 0; border-radius: 0 0 24px 24px; margin-left: -12px; margin-right: -12px; width: auto; padding: 4px 20px 20px; }
.card.top .hd { padding: 14px 0 16px; }
.card-t { margin: 0 0 6px; font-size: 16px; font-weight: 700; }
.card .sec-h { margin-bottom: 0; }
.card .row:last-child { border-bottom: 0; }
.avatar { background: var(--bg); border: 2px solid var(--brand); box-shadow: inset 0 0 0 3px var(--tint); color: var(--primary); }
.pillbtn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 14px; flex: 0 0 auto; }
.pillbtn svg:first-child { color: var(--primary); }
.bal-lbl2 { display: block; font-size: 14px; color: var(--text2); font-weight: 500; }
.bal-line { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
.bal-amt2 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.bal-amt2 small { font-size: 18px; color: var(--text2); font-weight: 700; }
.eye2 { width: 40px; height: 40px; border-radius: 12px; border: 0; background: none; color: var(--text2); display: grid; place-items: center; }
.acct-line { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 16px; font-weight: 600; }
.acct-bank { font-size: 12.5px; font-weight: 700; color: var(--primary); background: var(--tint); border-radius: 6px; padding: 1px 7px; }
.copy { width: 36px; height: 36px; border: 0; background: none; color: var(--text2); display: grid; place-items: center; border-radius: 10px; margin-left: -4px; }
.saved-strip { margin-top: 14px; width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 14px; border: 0; background: var(--tint); color: var(--primary); font-size: 14px; font-weight: 600; text-align: left; }
.saved-strip b { color: var(--ink); font-size: 15px; }
.saved-strip .tag { font-size: 12px; font-weight: 700; background: var(--bg); border-radius: 6px; padding: 2px 7px; }
.saved-strip .chev { margin-left: auto; display: grid; }
.acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 18px; }
.act { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; padding: 0; min-height: 84px; color: var(--ink); }
.act .ring { width: 60px; height: 60px; border-radius: 50%; background: #FFF3EA; border: 1.5px solid #F8C9A8; color: var(--primary); display: grid; place-items: center; }
.banner { position: relative; overflow: hidden; margin-top: 10px; border-radius: 20px; padding: 18px; background: linear-gradient(120deg, #CC4A0A 0%, #E0651E 60%, #F0873F 100%); color: #fff; display: flex; gap: 8px; }
.banner-txt { position: relative; z-index: 1; flex: 1; min-width: 0; }
.banner h2 { margin: 0; font-size: 21px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; max-width: 14ch; }
.banner p { margin: 6px 0 14px; font-size: 14px; color: #FFE9DC; }
.banner-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.bpill { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; }
.bpill.on { background: #fff; color: var(--primary); }
.banner-art { position: absolute; right: 14px; top: 14px; display: flex; align-items: center; gap: 5px; height: 44px; opacity: .3; }
.banner-art i { display: block; width: 6px; max-height: 44px; border-radius: 999px; background: #fff; }
.qgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.qtile { display: flex; align-items: center; gap: 6px; min-height: 56px; padding: 6px; border-radius: 16px; border: 1px solid var(--line); background: #FAFBFA; font-weight: 600; font-size: 13.5px; line-height: 1.25; text-align: left; word-break: normal; overflow-wrap: normal; hyphens: none; }
.qtile .qi { width: 34px; height: 34px; }
@media (max-width: 400px) { .qtile { flex-direction: column; justify-content: center; text-align: center; padding: 10px 4px; min-height: 84px; } }
.qi { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--primary); display: grid; place-items: center; flex: 0 0 auto; }
.rowcard { display: flex; align-items: center; gap: 12px; min-height: 72px; }
.rc-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rc-mid b { font-size: 15px; font-weight: 600; }
.rc-mid span { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowcard .chev { color: var(--text2); display: grid; }
.exrow { display: flex; gap: 10px; overflow-x: auto; padding: 6px 16px 4px 0; scroll-snap-type: x mandatory; scrollbar-width: none; }
.exrow::-webkit-scrollbar { display: none; }
.excard { flex: 0 0 168px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 16px; border: 0; text-align: left; min-height: 132px; }
.excard b { font-size: 15px; line-height: 1.25; }
.excard span:last-child { font-size: 13px; color: var(--text2); }
.excard .qi { background: rgba(255,255,255,.7); border: 0; }
.excard.t1 { background: #E8F6E5; } .excard.t1 .qi { color: var(--green); } .excard.t2 { background: #FFF4E0; } .excard.t2 .qi { color: var(--warn); }
.excard.t3 { background: #E7F0FB; } .excard.t3 .qi { color: #1F5FA8; } .excard.t4 { background: #F3ECFA; } .excard.t4 .qi { color: #6A3FA0; }
/* other pages: same card language */
.group { background: var(--bg); border: 0; }
.summary div { background: var(--bg); }
.view > .summary { margin-top: 0; }
.dock { box-shadow: 0 -1px 0 var(--line); border-top: 0; }
