<title>Vosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Vosa — light mode. White with a light-green signature; one deep green for actions. */
:root {
  --bg: #FFFFFF;
  --surface: #F5F7F6;      /* inputs, list wells */
  --tint: #E8F6E5;         /* light green: icon tiles, highlights */
  --tint-2: #D5EFD0;       /* text on the deep-green card */
  --brand: #18934A;        /* icons, progress */
  --primary: #0C6B35;      /* buttons and the balance card (6.6:1 with white) */
  --ink: #0E1B14;
  --text2: #5F6E65;        /* secondary text (5.4:1) */
  --line: #EBEFEC;
  --danger: #C2362B; --danger-bg: #FDEEEC;
  --warn: #965A00; --warn-bg: #FFF4E0;
  --font: "Plus Jakarta Sans", "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-yo: "Noto Sans", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #EEF1EF; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
:root[lang="yo"] body { font-family: var(--font-yo); line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

.app { position: relative; height: 100%; max-width: 440px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 480px) { .app { box-shadow: 0 0 0 1px var(--line); } }
.views { flex: 1; overflow-y: auto; }
.view { display: flex; flex-direction: column; padding: 0 20px 24px; }

/* page header */
.hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 12px; }
.hd-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--tint); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: 0 0 auto; }
.hi { font-size: 18px; font-weight: 700; line-height: 1.25; margin: 0; }
.hi-sub { font-size: 14px; color: var(--text2); margin: 0; }
.hd-actions { display: flex; gap: 8px; }
.iconbtn { height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink); }
.iconbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.title { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }

/* balance card */
.bal { background: var(--primary); color: #fff; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.bal-top { display: flex; justify-content: space-between; align-items: center; }
.bal-lbl { font-size: 14px; color: var(--tint-2); font-weight: 500; }
.eye { border: 0; background: rgba(255,255,255,.12); color: #fff; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.bal-amt { font-size: 34px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
.bal-amt small { font-size: 18px; font-weight: 700; color: var(--tint-2); }
.bal-row { display: flex; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.16); font-size: 14px; }
.bal-row span { color: var(--tint-2); display: block; }
.bal-row b { font-size: 16px; font-weight: 700; }
.bal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.bal-tags span { font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.14); border-radius: 6px; padding: 3px 8px; }

/* quick actions */
.qa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 20px; }
.qa button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink); padding: 0; min-height: 76px; }
.qa .tile { width: 52px; height: 52px; border-radius: 16px; background: var(--tint); color: var(--primary); display: grid; place-items: center; }

/* voice card */
.voice { margin-top: 20px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); text-align: left; width: 100%; }
.voice .vm { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; flex: 0 0 auto; }
.voice b { display: block; font-size: 15px; }
.voice > div > span { font-size: 14px; color: var(--text2); }
.voice .chev { margin-left: auto; color: var(--text2); flex: 0 0 auto; }

/* sections + lists */
.sec { margin-top: 28px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.sec-h h2 { margin: 0; font-size: 17px; font-weight: 700; }
.more { border: 0; background: none; color: var(--primary); font-weight: 700; font-size: 14px; padding: 10px 0 10px 12px; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.row:last-child { border-bottom: 0; }
.gtile { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; font-weight: 800; font-size: 16px; }
.row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.row .mid b { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.row .mid span { font-size: 13.5px; color: var(--text2); }
.row .end { text-align: right; flex: 0 0 auto; }
.row .end b { display: block; font-size: 15px; font-weight: 700; }
.row .end span { font-size: 13px; color: var(--text2); }
.row .end .in { color: var(--primary); }
.bar { height: 6px; border-radius: 999px; background: var(--surface); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .5s ease; }
.pill-s { display: inline-block; white-space: nowrap; font-size: 12.5px; font-weight: 600; border-radius: 6px; padding: 2px 8px; background: var(--tint); color: var(--primary); }
.pill-s.behind { background: var(--warn-bg); color: var(--warn); }
.empty { color: var(--text2); font-size: 14px; padding: 12px 0; margin: 0; }
.flash { animation: flash 1.2s ease; }
@keyframes flash { from { background: var(--tint); } to { background: transparent; } }
.day { margin: 18px 0 0; font-size: 13px; font-weight: 700; color: var(--text2); }
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.summary div { background: var(--surface); border-radius: 14px; padding: 14px; }
.summary span { display: block; font-size: 13px; color: var(--text2); }
.summary b { font-size: 18px; font-weight: 800; }

/* settings */
.group { margin-top: 20px; border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; }
.group-t { margin: 24px 0 8px; font-size: 13px; font-weight: 700; color: var(--text2); }
.set { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; border-bottom: 1px solid var(--line); padding: 10px 0; }
.set:last-child { border-bottom: 0; }
.set b { display: block; font-size: 15px; font-weight: 600; }
.set .d { font-size: 13.5px; color: var(--text2); }
.seg { display: inline-flex; background: var(--surface); border-radius: 10px; padding: 3px; flex: 0 0 auto; }
.seg button { min-height: 36px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: none; font-weight: 600; font-size: 13.5px; color: var(--text2); }
.seg button[aria-checked="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(14,27,20,.12); }
.sw { border: 0; background: none; padding: 6px 0; flex: 0 0 auto; }
.sw i { width: 46px; height: 28px; border-radius: 999px; background: #C9D2CD; position: relative; display: block; transition: background .15s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.sw[aria-checked="true"] i { background: var(--primary); }
.sw[aria-checked="true"] i::after { left: 21px; }
.link { border: 0; background: none; color: var(--primary); font-weight: 700; font-size: 14px; padding: 8px 0; }

/* reply bar + dock */
.replybar { display: flex; align-items: center; gap: 10px; margin: 0 12px 8px; padding: 10px 10px 10px 12px; border-radius: 14px; background: var(--ink); color: #fff; }
.replybar[hidden] { display: none; }
.replybar .vmk { flex: 0 0 auto; }
.replybar p { margin: 0; flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.replybar button { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; border: 0; background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; }
.dock { display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: end; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; border: 0; background: none; font-size: 12px; font-weight: 600; color: var(--text2); }
.tab[aria-current="page"] { color: var(--primary); }
.mic-wrap { display: flex; justify-content: center; margin-top: -26px; }
.mic { width: 64px; height: 64px; border-radius: 50%; border: 4px solid var(--bg); background: var(--primary); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(12,107,53,.28); }

/* buttons */
.btn { min-height: 54px; border-radius: 14px; border: 0; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; width: 100%; }
.btn.p { background: var(--primary); color: #fff; }
.btn.s { background: var(--surface); color: var(--ink); }
.btn.o { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.btn.d { background: var(--danger-bg); color: var(--danger); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* overlays */
.ov { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg); }
.ov.sheet { background: rgba(14,27,20,.42); justify-content: flex-end; overflow: hidden; }
.sh { background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; max-height: 92%; overflow-y: auto; }
.grab { width: 40px; height: 4px; border-radius: 999px; background: #D7DDD9; align-self: center; margin-bottom: 4px; }
.sh-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sh-h h2 { margin: 0; font-size: 18px; font-weight: 800; }
.x { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface); display: grid; place-items: center; flex: 0 0 auto; }
.heard { margin: 0; font-size: 13.5px; color: var(--text2); }
.heard b { color: var(--ink); font-weight: 600; }
.vsay { display: flex; gap: 10px; align-items: flex-start; background: var(--tint); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
.vsay p { margin: 0; flex: 1; }
.vsay button { flex: 0 0 auto; border: 0; background: none; color: var(--primary); padding: 0; height: 24px; }
.big-amt { text-align: center; padding: 6px 0 2px; }
.big-amt span { display: block; font-size: 13.5px; color: var(--text2); font-weight: 600; }
.big-amt b { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; }
.kv { border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
.kv div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.kv div:last-child { border-bottom: 0; }
.kv span { color: var(--text2); }
.kv b { font-weight: 700; text-align: right; }
.lockrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); font-size: 14.5px; }
.lockrow .lk { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: #fff; display: grid; place-items: center; flex: 0 0 auto; }
.lockrow b { display: block; }
.lockrow > div > span { color: var(--text2); font-size: 13.5px; }
.digits { display: flex; gap: 8px; justify-content: center; }
.lockrow .digits span { width: 48px; height: 56px; border-radius: 12px; background: var(--bg); border: 1px solid #D5DCD8; display: grid; place-items: center; font-size: 26px; font-weight: 800; color: var(--primary); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.lockrow .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--primary); background: var(--tint); border-radius: 999px; padding: 4px 10px; border: 0; }
.lockrow .chk.off { color: var(--text2); background: var(--bg); border: 1px dashed #B9C4BE; }
.tries { font-size: 13.5px; font-weight: 700; color: var(--danger); margin: 0; }
.field { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid #D5DCD8; background: var(--bg); padding: 0 14px; font-size: 16px; }
.field:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.inrow { display: flex; gap: 8px; }
.inrow .field { flex: 1; min-width: 0; }
.inrow .btn { width: auto; }
.lbl { font-size: 13.5px; font-weight: 600; color: var(--text2); margin: 0 0 6px; display: block; }
.choice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choice.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opt { min-height: 46px; border-radius: 12px; border: 1px solid #D5DCD8; background: var(--bg); font-weight: 600; font-size: 14px; padding: 0 6px; }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--primary); background: var(--tint); color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.calc { background: var(--tint); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--text2); }
.calc b { color: var(--ink); font-size: 20px; font-weight: 800; }
.ct { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; font-size: 13px; font-weight: 600; padding: 0; }
.ct .av { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; color: var(--ink); box-shadow: inset 0 0 0 2px transparent; }
.ct[aria-checked="true"] .av { background: var(--tint); color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); }
.ex { display: flex; align-items: center; gap: 12px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; font-size: 15px; }
.ex:last-child { border-bottom: 0; }
.ex .ei { color: var(--brand); flex: 0 0 auto; }

/* full-screen pages (success, money in, onboarding, forms) */
.pg { flex: 1; display: flex; flex-direction: column; padding: 0 20px; }
.pg-h { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
.back { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface); display: grid; place-items: center; flex: 0 0 auto; }
.pg-h h1 { margin: 0; font-size: 18px; font-weight: 800; }
.pg-body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-bottom: 16px; }
.pg-foot { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 calc(20px + env(safe-area-inset-bottom, 0px)); }
.done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 48px 0 8px; }
.done .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--tint); color: var(--primary); display: grid; place-items: center; margin-bottom: 10px; }
.done h1 { margin: 0; font-size: 20px; font-weight: 800; }
.done .amt { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.nudge { border-radius: 16px; background: var(--tint); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.nudge p { margin: 0; font-weight: 600; }
.brand-row { display: flex; align-items: center; gap: 10px; }
.wordmark { font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
.lang-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid #D5DCD8; background: var(--bg); width: 100%; text-align: left; }
.lang-row b { display: block; font-size: 16px; }
.lang-row span { font-size: 13.5px; color: var(--text2); }
.lang-row[aria-checked="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--tint); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #B9C4BE; flex: 0 0 auto; }
[aria-checked="true"] > .radio { border: 7px solid var(--primary); }

/* listening sheet */
.listen { position: absolute; inset: 0; z-index: 30; background: rgba(14,27,20,.42); display: flex; flex-direction: column; justify-content: flex-end; }
.listen[hidden] { display: none; }
.lsh { background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.lsh-h { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.lstate { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--primary); }
.lstate i { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: block; }
.wave { display: flex; align-items: center; justify-content: center; gap: 5px; height: 64px; }
.wave i { display: block; width: 5px; border-radius: 999px; background: var(--brand); }
@media (prefers-reduced-motion: no-preference) {
  .wave i { animation: w .9s ease-in-out infinite alternate; }
  .wave i:nth-child(2n) { animation-delay: .15s; } .wave i:nth-child(3n) { animation-delay: .35s; }
  .wave.calm i { animation: none; transform: scaleY(.3); }
}
@keyframes w { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.live { min-height: 60px; font-size: 20px; font-weight: 700; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.stop { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; }
.lhint { margin: 0; font-size: 13.5px; color: var(--text2); }
@media (prefers-reduced-motion: reduce) { .flash, .bar i { animation: none; transition: none; } }
</style>

<div class="app" id="app">
  <main class="views" id="views">
    <section class="view" id="v-home" aria-label="Home"></section>
    <section class="view" id="v-pots" aria-label="Savings" hidden></section>
    <section class="view" id="v-activity" aria-label="Activity" hidden></section>
    <section class="view" id="v-settings" aria-label="Settings" hidden></section>
  </main>

  <div class="replybar" id="replybar" hidden>
    <span class="vmk" id="reply-mark"></span>
    <p id="say-text" aria-live="polite"></p>
    <button id="replay" type="button"></button>
    <button id="kbd" type="button"></button>
  </div>

  <nav class="dock" id="dock" aria-label="Main">
    <button class="tab" type="button" data-view="home"></button>
    <button class="tab" type="button" data-view="pots"></button>
    <div class="mic-wrap"><button class="mic" id="mic" type="button"></button></div>
    <button class="tab" type="button" data-view="activity"></button>
    <button class="tab" type="button" data-view="settings"></button>
  </nav>

  <div class="ov" id="overlay" hidden></div>

  <div class="listen" id="listen" hidden role="dialog" aria-modal="true" aria-labelledby="listen-state">
    <div class="lsh">
      <div class="grab" aria-hidden="true"></div>
      <div class="lsh-h">
        <span class="lstate" id="listen-state"></span>
        <button class="x" id="listen-cancel" type="button"></button>
      </div>
      <div class="wave" id="wave" aria-hidden="true"><i style="height:20px"></i><i style="height:38px"></i><i style="height:56px"></i><i style="height:30px"></i><i style="height:62px"></i><i style="height:44px"></i><i style="height:58px"></i><i style="height:26px"></i><i style="height:48px"></i><i style="height:22px"></i><i style="height:36px"></i></div>
      <span class="sr" id="live-label"></span>
      <p class="live" id="live-text" aria-live="polite"></p>
      <button class="stop" id="stop" type="button"></button>
      <p class="lhint" id="listen-hint1"></p>
      <p class="lhint" id="listen-hint2"></p>
    </div>
  </div>

  <div class="sr" id="announce" aria-live="assertive"></div>
</div>

<script>/* Vosa — language understanding and replies.
   Rule-based so the demo works offline and never needs an AI key.
   Handles English, Nigerian Pidgin and Yorùbá (with or without tone marks). */
(function (root) {
  'use strict';

  // ---------- text helpers ----------
  function norm(s) {
    return String(s || '')
      .replace(/₦/g, ' naira ').replace(/%/g, ' percent ')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/[’'`]/g, '')
      .replace(/(\d),(?=\d{3}\b)/g, '$1')
      .replace(/[^a-z0-9.\s]/g, ' ')
      .replace(/\.(?!\d)/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  const has = (t, re) => re.test(t);

  function fmt(n) {
    n = Math.round(n);
    return '₦' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // ---------- amounts ----------
  const EN_ONES = { zero: 0, one: 1, a: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
  const EN_TENS = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
  const EN_BIG = { thousand: 1e3, k: 1e3, million: 1e6, m: 1e6 };

  const YO_UNITS = { okan: 1, ookan: 1, eni: 1, kan: 1, meji: 2, eeji: 2, meta: 3, eeta: 3, merin: 4, eerin: 4, marun: 5, aarun: 5, mefa: 6, eefa: 6, meje: 7, eeje: 7, mejo: 8, eejo: 8, mesan: 9, eesan: 9, mewa: 10, eewa: 10, ogun: 20, ogbon: 30, ogoji: 40, aadota: 50, ogota: 60, aadorin: 70, ogorin: 80, aadorun: 90 };
  const YO_BIG = { egberun: 1e3, egbaa: 2e3, milionu: 1e6, miliyonu: 1e6, milionnu: 1e6 };
  const YO_FILLER = { un: 1, an: 1, lona: 1, ni: 0 };

  function digitAmount(t) {
    const re = /(?:^|\s)(?:n|naira\s*)?(\d+(?:\.\d+)?)\s*(k|thousand|m|million|mil|egberun)?(?=\s|$)/g;
    let m;
    while ((m = re.exec(t))) {
      if (m[1].replace('.', '').length >= 9) continue;
      let v = parseFloat(m[1]);
      const u = m[2];
      if (u === 'k' || u === 'thousand' || u === 'egberun') v *= 1e3;
      else if (u === 'm' || u === 'million' || u === 'mil') v *= 1e6;
      if (v >= 50) return Math.round(v);
    }
    return null;
  }

  function englishAmount(tokens) {
    let total = 0, cur = 0, started = false, sawReal = false;
    for (const w of tokens) {
      if (w in EN_ONES && !(w === 'a' && started)) { if (w !== 'a') sawReal = true; cur += EN_ONES[w]; started = true; }
      else if (w in EN_TENS) { cur += EN_TENS[w]; started = true; sawReal = true; }
      else if (w === 'hundred' && started) { cur = (cur || 1) * 100; }
      else if (w in EN_BIG && started) { total += (cur || 1) * EN_BIG[w]; cur = 0; sawReal = true; }
      else if (w === 'and' && started) { /* skip */ }
      else if (started) { break; }
    }
    const v = total + cur;
    return sawReal && v >= 50 ? v : null;
  }

  function yorubaSmall(tokens, i) {
    // reads a units/tens word at i (skipping fillers), returns [value, nextIndex]
    while (i < tokens.length && tokens[i] in YO_FILLER) i++;
    const after = { igba: 200, ogorun: 100, irinwo: 400, egbeta: 600, egberin: 800 };
    if (i < tokens.length && (tokens[i] in YO_UNITS || tokens[i] in after)) {
      let v = YO_UNITS[tokens[i]] || after[tokens[i]]; i++;
      while (i < tokens.length && (tokens[i] === 'un' || tokens[i] === 'an')) i++;
      return [v, i];
    }
    return [null, i];
  }

  function yorubaAmount(tokens) {
    let total = 0, found = false;
    for (let i = 0; i < tokens.length; i++) {
      const w = tokens[i];
      if (w in YO_BIG) {
        found = true;
        let [mult, j] = yorubaSmall(tokens, i + 1);
        if (mult == null && i > 0 && tokens[i - 1] in YO_UNITS) mult = YO_UNITS[tokens[i - 1]];
        total += YO_BIG[w] * (mult || 1);
        i = (mult != null ? j : i + 1) - 1;
      } else if (w === 'ogorun') {
        found = true;
        let [mult, j] = yorubaSmall(tokens, i + 1);
        total += 100 * (mult || 1);
        i = (mult != null ? j : i + 1) - 1;
      } else if (w === 'ati' && found) {
        continue;
      } else if (found && w in YO_UNITS && tokens[i - 1] === 'ati') {
        total += YO_UNITS[w];
      }

    return found && total >= 50 ? total : null;
  }

  function parseAmount(t) {
    return digitAmount(t) || yorubaAmount(t.split(' ')) || englishAmount(t.split(' '));
  }

  // ---------- dates ----------
  const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
  const MON_SHORT = { jan: 0, feb: 1, mar: 2, apr: 3, jun: 5, jul: 6, aug: 7, sep: 8, sept: 8, oct: 9, nov: 10, dec: 11 };
  const YO_MONTHS = { sere: 0, erele: 1, erena: 2, igbe: 3, ebibi: 4, okudu: 5, agemo: 6, owewe: 8, owara: 9, belu: 10, ope: 11 };

  function monthIndex(w) {
    let i = MONTHS.indexOf(w);
    if (i >= 0) return i;
    if (w in MON_SHORT) return MON_SHORT[w];
    if (w in YO_MONTHS) return YO_MONTHS[w];
    return -1;
  }

  function parseDeadline(t, now) {
    now = now || new Date();
    const out = (d, matched) => ({ date: d, rest: t.replace(matched, ' ').replace(/\s+/g, ' ').trim() });
    let m;
    if ((m = t.match(/\b(?:by |before |for |till |until |ki o to di |titi di )?(?:christmas|keresimesi|xmas)\b/))) {
      let d = new Date(now.getFullYear(), 11, 25);
      if (d - now < 7 * 864e5) d = new Date(now.getFullYear() + 1, 11, 25);
      return { date: d, rest: t, christmas: true };
    }
    if ((m = t.match(/\b(?:by |before )?(?:the )?end of (?:the )?year\b|\bopin odun\b/))) {
      return out(new Date(now.getFullYear(), 11, 31), m[0]);
    }
    if ((m = t.match(/\b(?:in|within|for|ni|laarin) (\d+|[a-z]+) (weeks?|months?|osu|ose)\b/))) {
      let n = parseInt(m[1], 10);
      if (isNaN(n)) n = EN_ONES[m[1]] || YO_UNITS[m[1]] || 0;
      if (n) {
        const d = new Date(now);
        if (/week|ose/.test(m[2])) d.setDate(d.getDate() + 7 * n); else d.setMonth(d.getMonth() + n);
        return out(d, m[0]);
      }
    }
    if ((m = t.match(/\b(?:osu) (meji|meta|merin|marun|mefa|meje|mejo|mesan|mewa|\d+)\b/))) {
      const n = parseInt(m[1], 10) || YO_UNITS[m[1]];
      const d = new Date(now); d.setMonth(d.getMonth() + n);
      return out(d, m[0]);
    }
    if ((m = t.match(/\bnext month\b/))) { const d = new Date(now); d.setMonth(d.getMonth() + 1); return out(d, m[0]); }
    const re = /\b(by|before|in|till|until|for|reach|latest|ni|titi di|ki o to di|osu)\s+(?:end of |the end of )?([a-z]+)(?:\s+(\d{4}))?\b/g;
    while ((m = re.exec(t))) {
      const mi = monthIndex(m[2]);
      if (mi < 0) continue;
      let y = m[3] ? parseInt(m[3], 10) : now.getFullYear();
      let d = new Date(y, mi, 1);
      if (!m[3] && d - now < 14 * 864e5) d = new Date(y + 1, mi, 1);
      return out(d, m[0]);
    }
    // bare month name (not "may")
    const bare = t.match(/\b(january|february|march|april|june|july|august|september|october|november|december)\b(?:\s+(\d{4}))?/);
    if (bare) {
      const mi = MONTHS.indexOf(bare[1]);
      let y = bare[2] ? parseInt(bare[2], 10) : now.getFullYear();
      let d = new Date(y, mi, 1);
      if (!bare[2] && d - now < 14 * 864e5) d = new Date(y + 1, mi, 1);
      return out(d, bare[0]);
    }
    return null;
  }

  // ---------- days ----------
  const DAYS = [
    { re: /\b(monday|mon|aje|ojo aje)\b/, i: 1 },
    { re: /\b(tuesday|tue|tues|isegun|ojo isegun)\b/, i: 2 },
    { re: /\b(wednesday|wed|ojoru)\b/, i: 3 },
    { re: /\b(thursday|thur|thurs|ojobo)\b/, i: 4 },
    { re: /\b(friday|fri|eti|ojo eti|jimoh|jimo)\b/, i: 5 },
    { re: /\b(saturday|sat|abameta|satide)\b/, i: 6 },
    { re: /\b(sunday|sun|aiku|ojo aiku|sonde)\b/, i: 0 }
  ];
  function parseDay(t) {
    for (const d of DAYS) if (d.re.test(t)) return d.i;
    if (/\b(payday|pay day|salary|month end|end of the month|end of month|ojo owo osu)\b/.test(t)) return 'payday';
    return null;
  }

  // ---------- goals ----------
  const GOALS = {
    flex: { en: 'Flexible savings', pcm: 'Flexible savings', yo: 'Àpò ìfowópamọ́' },
    rent: { en: 'Rent', pcm: 'House rent', yo: 'Owó ilé' },
    school: { en: 'School fees', pcm: 'School fees', yo: 'Owó ilé-ìwé' },
    emergency: { en: 'Emergency fund', pcm: 'Emergency money', yo: 'Owó pàjáwìrì' },
    business: { en: 'Business', pcm: 'Business money', yo: 'Owó òwò' },
    travel: { en: 'Travel', pcm: 'Japa money', yo: 'Ìrìn-àjò' },
    phone: { en: 'New phone', pcm: 'New phone', yo: 'Fóònù tuntun' },
    wedding: { en: 'Wedding', pcm: 'Wedding', yo: 'Ìgbéyàwó' },
    christmas: { en: 'Christmas', pcm: 'Christmas', yo: 'Kérésìmesì' },
    car: { en: 'Car', pcm: 'Motor', yo: 'Ọkọ̀' }
  };
  const GOAL_RE = [
    ['school', /\b(school|fees|tuition|ile iwe|iwe omo|university|exam)\b/],
    ['rent', /\b(rent|house|ile|landlord|shelter)\b/],
    ['emergency', /\b(emergency|pajawiri|rainy day|hospital)\b/],
    ['business', /\b(business|shop|goods|okoowo|owo|oja|capital|market)\b(?! market fund)/],
    ['travel', /\b(japa|travel|visa|abroad|irin ajo|trip)\b/],
    ['phone', /\b(phone|laptop|foonu|iphone|gadget)\b/],
    ['wedding', /\b(wedding|igbeyawo|owambe|marriage)\b/],
    ['christmas', /\b(christmas|keresimesi|xmas|festive|sallah|salah|ileya)\b/],
    ['car', /\b(car|motor|moto|okada|keke|oko)\b/],
    ['flex', /\b(flexible|free savings|wallet|apo|savings account|general)\b/]
  ];
  function detectGoal(t) {
    // Avoid reading "owo" (money) alone as business: require owo oja / owo okoowo
    const t2 = t.replace(/\bowo (ile iwe|ile|pajawiri|oja|okoowo)\b/g, ' $1 ').replace(/\bowo\b/g, ' ').replace(/\bmoney market\b/g, ' ');
    for (const [k, re] of GOAL_RE) if (re.test(t2)) return k;
    return null;
  }
  function customGoalName(raw) {
    const t = norm(raw);
    const m = t.match(/\b(?:for|fun|towards|to buy|to)\s+(?:my |the |a |an |mi )?([a-z][a-z ]{2,24}?)(?=\s+(?:by|before|in|till|until|every|ni|titi|ki)\b|\s*$)/);
    if (!m) return null;
    let name = m[1].replace(/\b(goal|target|afojusun|savings?)\b/g, '').trim();
    if (!name || /^(me|it|am|you|naira|\d)/.test(name)) return null;
    return name.replace(/\b\w/g, c => c.toUpperCase());
  }

  // ---------- explain ----------
  const TERMS = [
    ['mmf', /\b(money market|mmf)\b/],
    ['tbill', /\b(treasury|t bill|tbill|tbills|t bills)\b/],
    ['mutual', /\b(mutual fund|mutual funds)\b/],
    ['inflation', /\b(inflation|price dey go up|owo ngbe)\b/],
    ['interest', /\b(interest|ele|owo ele|returns?)\b/],
    ['emergencyfund', /\b(emergency fund|owo pajawiri)\b/]
  ];
  const EXPLAIN_TRIGGER = /\b(what is|whats|what are|wetin be|wetin|explain|meaning|mean|kini|ki ni|salaye|se alaye|tell me about|how does|how e dey work)\b/;

  // ---------- payments helpers ----------
  const DIGIT_WORDS = { zero: '0', oh: '0', o: '0', one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9' };
  function joinSpokenDigits(t) {
    // "zero one two three ..." (6+ digit words) -> "0123..."; also "0 1 2 3" -> "0123"
    let out = t.replace(/\b(?:(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)\s+){5,}(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)\b/g,
      (m) => m.split(/\s+/).map(w => DIGIT_WORDS[w]).join(''));
    out = out.replace(/\b(?:\d\s){5,}\d\b/g, (m) => m.replace(/\s/g, ''));
    return out;
  }
  const BANKS = [
    ['GTBank', /\b(gtbank|gtb|guaranty|gt bank)\b/], ['Access Bank', /\baccess\b/], ['Zenith Bank', /\bzenith\b/],
    ['First Bank', /\b(first bank|firstbank)\b/], ['UBA', /\buba\b/], ['Kuda', /\bkuda\b/], ['OPay', /\b(opay|o pay)\b/],
    ['Moniepoint', /\bmoniepoint\b/], ['PalmPay', /\b(palmpay|palm pay)\b/], ['Wema Bank', /\bwema\b/], ['Fidelity Bank', /\bfidelity\b/],
    ['Sterling Bank', /\bsterling\b/], ['Union Bank', /\bunion\b/], ['FCMB', /\bfcmb\b/], ['Stanbic IBTC', /\bstanbic\b/],
    ['Polaris Bank', /\bpolaris\b/], ['Ecobank', /\becobank\b/]
  ];
  const parseBank = (t) => { const b = BANKS.find(([, re]) => re.test(t)); return b ? b[0] : null; };
  const parseAccount = (t) => { const m = t.match(/\b(\d{10})\b/); return m ? m[1] : null; };
  const parsePhone = (t) => { const m = t.match(/\b(0[789][01]\d{8})\b/); return m ? m[1] : null; };
  const NETWORKS = [['MTN', /\bmtn\b/], ['Airtel', /\bairtel\b/], ['Glo', /\b(glo|globacom)\b/], ['9mobile', /\b(9mobile|9 mobile|etisalat)\b/]];
  const parseNetwork = (t) => { const n = NETWORKS.find(([, re]) => re.test(t)); return n ? n[0] : null; };
  function parsePct(t) {
    const m = t.match(/\b(\d{1,2})\s*(?:percent|per cent|pc|%)/) || t.match(/\b(?:ida|idaa)\s+(\d{1,2})\b/);
    if (m) return parseInt(m[1], 10);
    const w = t.match(/\b(five|ten|fifteen|twenty|twenty five|thirty|fifty)\s+(?:percent|per cent)\b/);
    if (w) return { five: 5, ten: 10, fifteen: 15, twenty: 20, 'twenty five': 25, thirty: 30, fifty: 50 }[w[1]];
    if (/\bhalf\b|\bidaji\b/.test(t)) return 50;
    return null;
  }
  function findContact(t, contacts) {
    for (const c of contacts || []) {
      const names = [c.name].concat(c.aliases || []).map(n => norm(n));
      if (names.some(n => new RegExp('\\b' + n + '\\b').test(t))) return c;
    }
    return null;
  }

  // ---------- challenge digits (anti-replay) ----------
  const DIGIT_MAP = {
    zero: 0, oh: 0, one: 1, two: 2, to: 2, too: 2, three: 3, four: 4, for: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9,
    odo: 0, ookan: 1, okan: 1, eeji: 2, meji: 2, eeta: 3, meta: 3, eerin: 4, merin: 4, aarun: 5, marun: 5, eefa: 6, mefa: 6, eeje: 7, meje: 7, eejo: 8, mejo: 8, eesan: 9, mesan: 9
  };
  const TENS_MAP = { twenty: 2, thirty: 3, forty: 4, fourty: 4, fifty: 5, sixty: 6, seventy: 7, eighty: 8, ninety: 9 };
  function newChallenge() {
    let d = '';
    while (d.length < 3) { const x = 2 + Math.floor(Math.random() * 8); if (!d.endsWith(String(x))) d += x; }
    return d;
  }
  // Turns "blue mango seven four two", "742", "7 4 2" or "meje merin meji" into "742"
  function spokenDigits(raw) {
    const toks = norm(raw).split(' ');
    let out = '';
    for (let i = 0; i < toks.length; i++) {
      const w = toks[i];
      if (/^\d+$/.test(w)) { out += w; continue; }
      if (w in TENS_MAP) {
        const nx = toks[i + 1];
        if (nx && nx in DIGIT_MAP && DIGIT_MAP[nx] > 0) { out += TENS_MAP[w] + '' + DIGIT_MAP[nx]; i++; }
        else out += TENS_MAP[w] + '0';
        continue;
      }
      if (w in DIGIT_MAP) {
        // "to"/"for"/"too" only count as numbers when next to other numbers
        if (['to', 'too', 'for'].includes(w)) {
          const prev = toks[i - 1], next = toks[i + 1];
          const isNum = (x) => x && (/^\d+$/.test(x) || (x in DIGIT_MAP && !['to', 'too', 'for'].includes(x)) || x in TENS_MAP);
          if (!isNum(prev) && !isNum(next)) continue;
        }
        out += DIGIT_MAP[w];
      }
    }
    return out;
  }
  const challengeOk = (raw, challenge) => spokenDigits(raw).includes(challenge);

  // ---------- understanding ----------
  const YES = /^(yes|yeah|yea|yep|yup|ok|okay|confirm|sure|do it|go ahead|correct|na so|oya|do am|abeg do am|make e be|e do|sharp|beeni|bee ni|en|o daa|o dara|mo gba|ti gba|bee ni o)\b/;
  const NO = /^(no|nope|cancel|stop|dont|do not|abeg no|leave am|forget am|no do am|no wahala no|rara|ma se|fi sile|fagile|bee ko)\b/;

  function understand(raw, ctx) {
    ctx = ctx || {};
    const now = ctx.now || new Date();
    const t0 = joinSpokenDigits(norm(raw));
    const r = { raw, t: t0 };

    if (ctx.pending) {
      if (YES.test(t0)) return { intent: 'yes' };
      if (NO.test(t0)) return { intent: 'no' };
    }
    if (ctx.awaiting && NO.test(t0) && !/\d/.test(t0)) return { intent: 'no' };
    if (!t0) return { intent: 'unknown' };

    const dl = parseDeadline(t0, now);
    const t = dl ? dl.rest : t0;
    r.deadline = dl ? dl.date : null;
    r.amount = parseAmount(t);
    r.goal = detectGoal(t0);
    r.day = parseDay(t0);

    // slot filling for a question Vosa just asked
    if (ctx.awaiting === 'account' || ctx.awaiting === 'recipient') {
      // Account numbers are often heard in groups ("012 345 6789") or as words ("zero one two ...")
      const digits = spokenDigits(raw);
      const bank = parseBank(t0);
      if (digits.length === 10 || (digits.length === 11 && digits[0] === '0' && bank && /opay|palmpay|moniepoint|kuda/i.test(bank))) {
        r.account = digits.length === 11 ? digits.slice(1) : digits; r.bank = bank; r.amount = null; r.intent = 'fill'; return r;
      }
    }
    if (ctx.awaiting === 'bank' && parseBank(t0)) { r.bank = parseBank(t0); r.intent = 'fill'; return r; }
    if (ctx.awaiting === 'amount' && r.amount && !/\b(withdraw|balance|how much)\b/.test(t0)) { r.intent = 'fill'; return r; }
    if (ctx.awaiting === 'day' && r.day != null) { r.intent = 'fill'; return r; }

    // hands-free on/off
    if (/\b(hands ?free|stop listening|keep listening|start listening|listen continuously)\b/.test(t0)) {
      r.intent = 'handsfree'; r.on = !/\b(off|stop|disable|turn off)\b/.test(t0); return r;
    }
    // change secret phrase
    let sm;
    if ((sm = t0.match(/\b(?:secret phrase|secret word|passphrase|password|oro asiri)\b.*?\b(?:to|is|be|na|ni|as)\s+(.{3,40})$/))) {
      r.intent = 'setsecret'; r.phrase = sm[1].trim(); return r;
    }
    r.contact = findContact(t0, ctx.contacts);
    r.account = parseAccount(t0);
    r.bank = parseBank(t0);
    r.phone = parsePhone(t0);
    r.network = parseNetwork(t0);
    r.pct = parsePct(t0);

    if (/\b(account number|my account details|my account no|acct number|account no|nomba akanti|account details)\b/.test(t0) && !/\b(send|transfer)\b/.test(t0)) { r.intent = 'account'; return r; }

    if (/\b(auto ?save|automatically save|save automatically|any money (i|wey i) (receive|get)|every money|whenever .*?(receive|enter|come)|anytime money|owo to ba wole|owo ba wole)\b/.test(t0)) {
      r.intent = /\b(stop|off|cancel|disable|no more)\b/.test(t0) ? 'autosaveoff' : 'autosave'; return r;
    }

    if (/\b(airtime|recharge|card|credit for my line|top up my line|load card|kaadi ipe|kaadi|data)\b/.test(t0)) { r.intent = 'airtime'; return r; }

    // "send money", "send 5k", "transfer to a GTB account", "pay Tunde" -> send. "send 5k to my rent" -> save.
    const sendVerb = /\b(send|transfer|wire|ranse|fi ranse)\b/.test(t0) || (/\b(pay|give)\b/.test(t0) && !/\bgive me\b/.test(t0) && (r.contact || r.account || r.bank || /\b(to|give|si|fun)\s+[a-z]/.test(t0)));
    const saveCtx = /\b(save|pamo|savings|for my (rent|school|goal))\b/.test(t0) || (r.goal && !r.contact && !r.account && !r.bank);
    if ((sendVerb && !saveCtx) || (r.contact && r.amount && !/\b(save|pamo)\b/.test(t0))) {
      r.intent = 'send';
      if (!r.contact && !r.account) {
        const all = [...t0.matchAll(/\b(?:to|give|si)\s+([a-z]{1,20})\b/g)];
        const nm = all.length ? all[all.length - 1] : null;
        const generic = /^(send|transfer|pay|give|buy|save|withdraw|my|the|a|an|one|me|am|him|her|them|person|someone|somebody|account|bank|money|wallet|another|other|this|that|una|im|e|o)$/;
        r.unknownName = nm && !generic.test(nm[1]) && !parseBank(nm[1]) && !(nm[1] in DIGIT_MAP) ? nm[1] : null;
      }
      return r;
    }
    if (ctx.awaiting === 'recipient' && (r.contact || r.account)) { r.intent = 'fill'; return r; }

    if (/\b(help|what can you do|wetin you fit do|how e dey work|how does this work|ran mi lowo|kini o le se|ki lo le se)\b/.test(t0)) { r.intent = 'help'; return r; }

    const term = TERMS.find(([, re]) => re.test(t0));
    if (term && (EXPLAIN_TRIGGER.test(t0) || /\?/.test(raw) || !['interest', 'emergencyfund'].includes(term[0])) && !r.amount) {
      r.intent = 'explain'; r.term = term[0]; return r;
    }

    if (/\b(withdraw|take out|takeout|comot|cash out|remove|collect|bring out|yo owo|yo kuro|yo jade|gba owo|mu owo|yo)\b/.test(t0)) { r.intent = 'withdraw'; return r; }

    if (/\b(remind|reminder|remember me|ranti|ran mi leti|leti)\b/.test(t0)) { r.intent = 'remind'; return r; }

    const wantsGoal = /\b(goal|target|afojusun|plan)\b/.test(t0) ||
      (r.deadline && /\b(want|wan|wanna|need|fe|plan|go save|dey save|save up|gather)\b/.test(t0));
    if (wantsGoal && !/\b(how much|balance|elo|melo)\b/.test(t0)) {
      r.intent = 'goal';
      if (!r.goal) r.customName = customGoalName(dl ? dl.rest : raw);
      return r;
    }

    if (/\b(wallet|spend money|apo owo)\b/.test(t0) && /\b(how much|balance|elo|melo|check|wetin)\b/.test(t0)) { r.intent = 'wallet'; return r; }
    if (/\b(balance|how much|how far with|wetin (i|dey|remain)|i get how much|elo|melo|iye owo|owo melo|how my money|check)\b/.test(t0)) { r.intent = 'balance'; return r; }

    if (/\b(my goals|all goals|goals|list|show me|afojusun mi|gbogbo)\b/.test(t0) && !r.amount) { r.intent = 'goals'; return r; }

    if (/\b(save|put|keep|gather|add|deposit|drop|send|top up|pamo|fi kun|fikun|ko si|fi si|fi)\b/.test(t0) || r.amount) {
      r.intent = 'save';
      if (!r.goal) r.customName = customGoalName(raw);
      return r;
    }

    if (/\b(hello|hi|hey|how far|good morning|good afternoon|good evening|bawo|e kaaro|e kaasan|e kaale|pele)\b/.test(t0)) { r.intent = 'greet'; return r; }

    r.intent = 'unknown';
    return r;
  }

        h('div', { class: 'pg-foot' }, h('button', { class: 'btn p', type: 'button', onClick: () => showOv('onboard', { step: 2, hf: true }), text: t('cont') }))));
    } else {
      const opt = (on, title, desc, val) => h('button', { class: 'lang-row', type: 'button', role: 'radio', 'aria-checked': String(on), onClick: () => { d.hf = val; renderOv(); } },
        h('div', null, h('b', { text: title }), h('span', { text: desc })), h('span', { class: 'radio', 'aria-hidden': 'true' }));
      pageWrap(el, t('step', { n: 2 }), () => showOv('onboard', { step: 1 }), [
        h('h2', { style: 'margin:4px 0 0;font-size:24px;font-weight:800;letter-spacing:-0.02em;line-height:1.25', text: t('howTalk') }),
        h('div', { role: 'radiogroup', style: 'display:flex;flex-direction:column;gap:10px' }, opt(d.hf, t('handsFree'), t('hfOptD'), true), opt(!d.hf, t('tapOpt'), t('tapOptD'), false)),
        h('div', { class: 'lockrow' }, h('span', { class: 'lk' }, icon('lock', 18)), h('div', null, h('b', { text: t('secret') }), h('span', { text: t('phraseInfo', { p: state.secret }) })))],
        [h('button', { class: 'btn p', type: 'button', onClick: () => { state.onboarded = true; persist(); setHandsFree(d.hf); if (backend.voiceId && !state.voicePrint) { showOv('enroll', { stage: 'intro', fromOnboard: true }); } else { closeOv(); reply(R('welcome')); } }, text: t('finish') })]);
    }
  }

  // ---------- language auto-detect ----------
  function detectLang(raw) {
    const n = L.norm(raw);
    if (/[ẹọṣẸỌṢ]/.test(raw) || (n.match(/\b(pamo|egberun|elo|melo|owo|kini|nibo|mi|fun|ni|wa|nino|yo|fi|beeni|rara|ranti|leti|afojusun|mo|fe|ile|ranse|si|ra|kaadi)\b/g) || []).length >= 2) return 'yo';
    if ((n.match(/\b(wetin|abeg|dey|wan|comot|una|fit|na|don|oya|wahala|abi|sef|sabi|make i|give)\b/g) || []).length >= 1 && !/\bgive me\b/.test(n)) return 'pcm';
    if ((n.match(/\b(the|is|do|have|what|want|how|my|please|from|for|much|to|any)\b/g) || []).length >= 2) return 'en';
    return null;
  }
  function maybeSwitch(raw) {
    if (pending && pending.needsPhrase) return;
    const d = detectLang(raw);
    if (d && d !== state.lang && !(d === 'en' && state.lang === 'pcm')) { state.lang = d; persist(); render(); announce(t('switched')); }
  }

  // ---------- optional: ask Claude when the rules don't understand (Claude preview only) ----------
  let sampleFn = null;
  (async () => { try { if (window.claude && window.claude.use) sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; } })();
  async function aiUnderstand(raw) {
    if (!sampleFn) return null;
    const prompt = 'You turn one request to a Nigerian voice money app into JSON. The user may speak English, Nigerian Pidgin or Yoruba (possibly without tone marks). ' +
      'Return ONLY a JSON object with keys: intent ("save"|"withdraw"|"send"|"airtime"|"balance"|"wallet"|"account"|"goal"|"remind"|"autosave"|"explain"|"help"|"goals"|"greet"|"unknown"), ' +
      'amount (number of naira or null), goal ("rent"|"school"|"emergency"|"business"|"travel"|"phone"|"wedding"|"christmas"|"car"|"flex"|null), ' +
      'customName (short goal name if none of those fit, else null), recipient (person name or null), deadlineMonth (1-12 or null), day (0=Sunday..6=Saturday, or null), pct (number or null), ' +
      'network ("MTN"|"Airtel"|"Glo"|"9mobile"|null), term ("mmf"|"tbill"|"mutual"|"inflation"|"interest"|"emergencyfund"|null), lang ("en"|"pcm"|"yo"). ' +
      '"goal" means creating a new savings target; "withdraw" means moving money out of savings. User said: ' + JSON.stringify(raw);
    try {
      status(t('asking'));
      const j = await sampleFn.json(prompt, { modelTier: 'quick' });
      if (!j || !j.intent || j.intent === 'unknown') return null;
      const r = { intent: j.intent, amount: j.amount || null, goal: L.GOALS[j.goal] ? j.goal : null, customName: j.customName || null, day: (j.day ?? null), term: j.term || null, pct: j.pct || null, network: j.network || null };
      if (j.recipient) { r.contact = state.contacts.find(c => [c.name].concat(c.aliases).some(a => a.toLowerCase() === String(j.recipient).toLowerCase())) || null; if (!r.contact) r.unknownName = j.recipient; }
      if (j.deadlineMonth) { const now = new Date(); let d = new Date(now.getFullYear(), j.deadlineMonth - 1, 1); if (d - now < 14 * 864e5) d = new Date(now.getFullYear() + 1, j.deadlineMonth - 1, 1); r.deadline = d; }
      if (j.lang && ['en', 'pcm', 'yo'].includes(j.lang) && j.lang !== state.lang) { state.lang = j.lang; persist(); render(); }
      return r;
    } catch (e) {
      if (e && e.code === 'not_granted') sampleFn = null;
      return null;
    } finally { status(''); }
  }

  // ---------- core flow ----------
  async function reply(text, lang) {
    lang = lang || state.lang;
    lastReply = text; lastReplyLang = lang;
    renderTalk();
    await speak(text, lang);
    afterReply();
  }

  function fail(sheet, text) { showOv('sheet', sheet); return reply(text); }
  const okAction = () => ({ label: t('ok'), primary: true, fn: closeOv });

  function cancelPending() {
    pending = null; closeOv();
    reply(R('cancelled'));
  }

  let busy = false;
  async function handle(raw, opts) {
    opts = opts || {};
    raw = String(raw || '').trim();
    if (!raw) return afterReply();
    stopListening();
    const phraseMode = !!(pending && pending.needsPhrase);
    const isPhrase = phraseMode && L.norm(raw).includes(L.norm(state.secret));
    lastHeard = isPhrase || (phraseMode && opts.via === 'text') ? '••••••' : raw;
    if (ov && ['success', 'moneyin', 'sheet', 'pot', 'amount', 'goal-form', 'send-form', 'airtime-form'].includes(ov.kind) && !(pending && pending.type === 'nudge')) closeOv();
    maybeSwitch(raw);
    renderTalk();
    let r = L.understand(raw, { pending: !!pending, awaiting: awaiting && awaiting.slot, contacts: state.contacts });

    if (phraseMode) {
      if (r.intent === 'no' && !isPhrase) return cancelPending();
      if (r.intent === 'yes' && !isPhrase) return reply(R('phraseHint') + R('challenge', { d: spaced(pending.challenge) }));
      if (voiceIdOn() && !(opts.via === 'voice' && opts.voice)) { renderOv(); return reply(R('sayAloud')); }
      const digitsOk = !pending.challenge || L.challengeOk(raw, pending.challenge);
      let voiceOk = true;
      if (voiceIdOn()) {
        if (opts.voice.score == null) { pending.challenge = L.newChallenge(); renderOv(); return reply(R('voiceShort', { d: spaced(pending.challenge) })); }
        pending.lastScore = opts.voice.score;
        voiceOk = opts.voice.score >= state.voiceStrict;
      }
      if (isPhrase && digitsOk && voiceOk) {
        pending.verified = voiceIdOn() ? t('verifyAll', { p: Math.round(opts.voice.score * 100) }) : t('verifyNoVoice');
        return execute();
      }
      pending.tries = (pending.tries || 0) + 1;
      if (pending.tries >= 3) {
        pending = null;
        return fail({ tone: 'err', icon: 'x', k: t('kLocked'), title: R('locked'), actions: [okAction()] }, R('locked'));
      }
      pending.challenge = L.newChallenge();
      pending.lastFail = !isPhrase ? 'phrase' : !digitsOk ? 'digits' : 'voice';
      renderOv();
      if (!isPhrase) return reply(R('phraseWrong') + R('challenge', { d: spaced(pending.challenge) }));
      if (!digitsOk) return reply(R('digitsWrong', { d: spaced(pending.challenge) }));
      return reply(R('voiceWrong', { d: spaced(pending.challenge) }));
    }

    if (r.intent === 'yes') { if (pending) return execute(); r.intent = 'unknown'; }
    if (r.intent === 'no') { if (pending) return cancelPending(); awaiting = null; return reply(R('cancelled')); }
    if (pending) { pending = null; if (ov && ['confirm', 'success', 'moneyin'].includes(ov.kind)) closeOv(); }

    if (awaiting) {
      // Vosa asked a question: keep what we already know and add the new answer to it
      const a = awaiting;
      if (mergeAnswer(a.r, r, a.slot)) { awaiting = null; r = a.r; }
      else if (['unknown', 'fill', 'yes'].includes(r.intent) || r.intent === a.r.intent) {
        a.miss = (a.miss || 0) + 1;
        if (a.miss >= 3) { awaiting = null; return reply(R('cancelled')); }
        const extra = (a.slot === 'account' || a.slot === 'recipient') && /\d/.test(raw) ? ' ' + R('sayDigits') : '';
        return reply(R('notCaught') + ' ' + (a.slot === 'account' ? R('askAccountNoBank') : a.text) + extra);
      } else awaiting = null;
    }

    if (r.intent === 'unknown') {
      busy = true;
      const ai = await aiUnderstand(raw);
      busy = false;
      if (ai) r = ai;
    }
    return route(r);
  }

  function mergeAnswer(base, r, slot) {
    let got = false;
    if (slot === 'day' && r.day != null) { base.day = r.day; got = true; }
    if (slot === 'amount' && r.amount) { base.amount = r.amount; got = true; }
    if (base.intent === 'send') {
      if (r.contact) { base.contact = r.contact; base.account = null; base.unknownName = null; got = true; }
      if (r.account) { base.account = r.account; base.contact = null; base.unknownName = null; got = true; }
      if (r.bank) { base.bank = r.bank; got = true; }
      if (r.amount && !r.account && slot !== 'amount' && !base.amount) { base.amount = r.amount; got = true; }
    }
    return got;
  }
  // Ask a follow-up question and remember what we are waiting for
  function ask(slot, r, key, vars) { const text = R(key, vars); awaiting = { slot, r, text }; return reply(text); }

  function resolveGoal(r, createIfMissing) {
    let g = findGoal(r.goal, r.customName);
    if (!g && !r.goal && !r.customName) g = findGoal('flex');
    if (!g && createIfMissing) {
      g = { key: r.goal || 'custom', name: r.goal ? null : (r.customName || null), bal: 0, target: null, deadline: null, isNew: true };
      if (!g.name && g.key === 'custom') g.name = 'My goal';
    }
    return g;
  }
  function progVars(g) {
    if (!g.target) return '';
    return R('prog', { pct: Math.min(100, Math.round(g.bal / g.target * 100)), target: fmt(g.target) });
  }
  function lowWallet(amount) {
    const text = R('lowWallet', { wallet: fmt(state.wallet), amt: fmt(amount) });
    return fail({ tone: 'warn', icon: 'alert', k: t('kNoMoney'), title: text, actions: [okAction(), { label: t('addDemo'), fn: () => { closeOv(); incoming(50000, 'Kemi Adewale'); } }] }, text);
  }
  function confirmWith(p, text) {
    if (p.needsPhrase) { p.challenge = L.newChallenge(); text += R('challenge', { d: spaced(p.challenge) }); }
    pending = p; showOv('confirm'); return reply(text);
  }

  function routeUI(r) { lastHeard = ''; renderTalk(); return route(r); }
  function route(r) {
    switch (r.intent) {
      case 'save': {
        if (!r.amount) { return ask('amount', r, 'askSave'); }
        if (state.wallet < r.amount) return lowWallet(r.amount);
        const g = resolveGoal(r, true);
        return confirmWith({ type: 'save', amount: r.amount, goal: g }, R('confirmSave', { amt: fmt(r.amount), goal: label(g) }));
      }
      case 'withdraw': {
        if (!r.amount) { return ask('amount', r, 'askWithdraw'); }
        const g = resolveGoal(r, false);
        if (!g) {
          const text = R('noGoal', { goal: r.goal ? L.GOALS[r.goal][state.lang] : (r.customName || '') });
          return fail({ tone: 'warn', icon: 'pot', k: t('kNoGoal'), title: text, actions: [okAction(), { label: t('createGoal'), fn: () => showOv('goal-form', { key: r.goal && GOAL_CHOICES.includes(r.goal) ? r.goal : 'other', amount: 50000, month: 2 }) }] }, text);
        }
        if (g.bal < r.amount) {
          const text = R('insufficient', { goal: label(g), bal: fmt(g.bal), amt: fmt(r.amount) });
          return fail({ tone: 'warn', icon: 'alert', k: t('kNoMoney'), title: text, actions: [okAction()] }, text);
        }
        return confirmWith({ type: 'withdraw', amount: r.amount, goal: g, needsPhrase: true }, R('confirmWithdraw', { amt: fmt(r.amount), goal: label(g) }));
      }
      case 'send': {
        if (!r.contact && !r.account && r.bank) return ask('account', r, 'askAccount', { bank: r.bank });
        if (!r.contact && !r.account) {
          if (r.unknownName) {
            const text = R('unknownContact', { name: r.unknownName.replace(/\b\w/g, c => c.toUpperCase()) });
            return fail({ tone: 'warn', icon: 'user', k: t('kNoContact'), title: text, actions: [okAction(), { label: t('sendMoney'), fn: () => showOv('send-form', { c: 0, amount: r.amount || 5000 }) }] }, text);
          }
          return ask('recipient', r, 'askRecipient');
        }
        if (!r.contact && !r.bank) return ask('bank', r, 'needBank', { acct: r.account });
        if (!r.amount) return ask('amount', r, 'askSend');
        if (state.wallet < r.amount) return lowWallet(r.amount);
        const to = r.contact ? { name: r.contact.name, bank: r.contact.bank, acct: r.contact.acct } : { name: r.account, bank: r.bank, acct: r.account };
        const text = r.contact ? R('confirmSend', { amt: fmt(r.amount), name: to.name, bank: to.bank, last4: to.acct.slice(-4) }) : R('confirmSendAcct', { amt: fmt(r.amount), bank: to.bank, acct: to.acct });
        return confirmWith({ type: 'send', amount: r.amount, to, needsPhrase: true }, text);
      }
      case 'airtime': {
        if (!r.amount) { return ask('amount', r, 'askAirtime'); }
        if (state.wallet < r.amount) return lowWallet(r.amount);
        const net = r.network || state.myNetwork;
        const who = r.phone ? r.phone : R('yourLine');
        return confirmWith({ type: 'airtime', amount: r.amount, net, who }, R('confirmAirtime', { amt: fmt(r.amount), net, who }));
      }
      case 'account': return reply(R('account', { acct: state.account }));
      case 'wallet': go('home'); return reply(R('wallet', { wallet: fmt(state.wallet) }));
      case 'autosave': {
        const pct = Math.min(50, r.pct || 10);
        const g = resolveGoal(r, true);
        if (g.isNew) { delete g.isNew; state.goals.push(g); }
        state.autoSave = { pct, ref: gref(g) };
        persist(); render();
        return reply(R('autosaveSet', { pct, goal: label(g) }));
      }
      case 'autosaveoff': state.autoSave = null; persist(); render(); return reply(R('autosaveOff'));
      case 'handsfree': setHandsFree(r.on); return reply(R(r.on ? 'handsfreeOn' : 'handsfreeOff'));
      case 'setsecret': {
        const phrase = r.phrase.replace(/[^\p{L}\p{N} ]/gu, '').trim();
        if (phrase.length < 3) return reply(R('unknown'));
        state.secret = phrase; persist(); render();
        return reply(R('secretSet', { phrase }));
      }
      case 'goal': {
        if (!r.amount) { return ask('amount', r, 'askGoal'); }
        const g = resolveGoal(r, true);
        const deadline = r.deadline || null;
        const vars = { goal: label(g), target: fmt(r.amount) };
        if (deadline) {
          vars.weekly = fmt(Math.ceil(Math.max(0, r.amount - g.bal) / weeksUntil(deadline) / 100) * 100);
          vars.date = L.dateLabel(deadline);
        }
        return confirmWith({ type: 'goal', goal: g, target: r.amount, deadline }, R(deadline ? 'confirmGoal' : 'confirmGoalNoDate', vars));
      }
      case 'balance': {
        const g = (r.goal || r.customName) ? findGoal(r.goal, r.customName) : null;
        if (g && g.key !== 'flex') { showOv('pot', { ref: gref(g) }); return reply(R('balanceGoal', { goal: label(g), bal: fmt(g.bal), prog: progVars(g) })); }
        go('home');
        const list = state.goals.map(x => label(x) + ': ' + fmt(x.bal)).join('. ') + '.';
        return reply(R('balanceTotal', { wallet: fmt(state.wallet), total: fmt(total()), list }));
      }
      case 'goals': {
        go('pots');
        const list = state.goals.map(x => label(x) + ' ' + fmt(x.bal)).join(', ');
        return reply(R('goals', { n: state.goals.length, list }));
      }
      case 'remind': {
        if (r.day == null) { return ask('day', r, 'askDay'); }
        if (!state.reminders.includes(r.day)) state.reminders.push(r.day);
        persist(); render();
        return reply(R('remind', { day: L.dayLabel(r.day, state.lang) }));
      }
      case 'explain': return reply((L.EXPLAIN[r.term] || {})[state.lang] || R('unknown'));
      case 'help': return reply(R('help'));
      case 'greet': return reply(R('greet'));
      default: {
        const text = R('unknown');
        return fail({ tone: 'warn', icon: 'wave', k: t('kDidnt'), title: text, actions: [
          { label: t('tryAgain'), primary: true, fn: () => { closeOv(); micDenied = false; startListening(); } },
          { label: t('typeInstead'), fn: () => { showOv('type'); } }] }, text);
      }
    }
  }

  function execute() {
    const p = pending; pending = null;
    if (!p) return reply(R('unknown'));
    if (p.goal && p.goal.isNew) { delete p.goal.isNew; state.goals.push(p.goal); }
    const g = p.goal;
    if (p.type === 'save' || p.type === 'nudge') {
      if (state.wallet < p.amount) return lowWallet(p.amount);
      state.wallet -= p.amount; g.bal += p.amount;
      logAct({ kind: 'save', g: gref(g), amt: p.amount });
      let msg = R('doneSave', { goal: label(g), bal: fmt(g.bal), prog: progVars(g) });
      if (g.target && g.bal >= g.target) msg += R('reached');
      flashGoal = g; persist(); render();
      showOv('success', { title: t('savedTo', { g: label(g) }), amount: p.amount, sub: g.target ? Math.min(100, Math.round(g.bal / g.target * 100)) + '% ' + t('of') + ' ' + fmt(g.target) : fmt(g.bal) });
      return reply(msg);
    }
    if (p.type === 'withdraw') {
      g.bal -= p.amount; state.wallet += p.amount;
      logAct({ kind: 'move', g: gref(g), amt: p.amount });
      persist(); render();
      showOv('success', { title: t('moved'), amount: p.amount, sub: label(g) + ': ' + fmt(g.bal), verified: p.verified });
      return reply(R('doneWithdraw', { amt: fmt(p.amount), goal: label(g), bal: fmt(g.bal) }));
    }
    if (p.type === 'goal') {
      g.target = p.target;
      g.deadline = p.deadline ? ymd(p.deadline) : null;
      flashGoal = g; persist(); go('pots');
      showOv('success', { title: t('goalSet'), amount: p.target, sub: label(g) + (p.deadline ? ' · ' + L.dateLabel(p.deadline) : '') });
      return reply(R('doneGoal', { goal: label(g), target: fmt(g.target) }));
    }
    if (p.type === 'send') {
      if (state.wallet < p.amount) return lowWallet(p.amount);
      state.wallet -= p.amount;
      logAct({ kind: 'send', n: p.to.name, amt: p.amount, detail: p.to.bank + ' •••• ' + p.to.acct.slice(-4) });
      let msg = R('doneSend', { name: p.to.name, amt: fmt(p.amount), wallet: fmt(state.wallet) });
      const nudge = roundTo(p.amount * 0.1, 500);
      const flex = findGoal('flex') || state.goals[0];
      if (p.amount >= 2000 && state.wallet >= nudge * 3 && flex) {
        msg += R('nudge', { nudge: fmt(nudge), goal: label(flex) });
        pending = { type: 'nudge', amount: nudge, goal: flex };
      }
      persist(); render();
      showOv('success', { title: t('sentTo', { n: p.to.name }), amount: p.amount, sub: p.to.bank + ' •••• ' + p.to.acct.slice(-4), verified: p.verified });
      return reply(msg);
    }
    if (p.type === 'airtime') {
      if (state.wallet < p.amount) return lowWallet(p.amount);
      state.wallet -= p.amount;
      const who = /^\d+$/.test(p.who) ? masked(p.who) : masked(state.myPhone);
      logAct({ kind: 'airtime', n: p.net, amt: p.amount, detail: who });
      persist(); render();
      showOv('success', { title: t('airtimeSent'), amount: p.amount, sub: p.net + ' · ' + who });
      return reply(R('doneAirtime', { amt: fmt(p.amount), net: p.net, who: p.who, wallet: fmt(state.wallet) }));
    }
  }

  function incoming(amount, name) {
    stopListening();
    pending = null;
    state.wallet += amount;
    logAct({ kind: 'in', n: name, amt: amount });
    let msg = R('incoming', { amt: fmt(amount), name, wallet: fmt(state.wallet) });
    if (state.autoSave) {
      const g = findRef(state.autoSave.ref || { key: 'flex' }) || findGoal('flex');
      const save = Math.round(amount * state.autoSave.pct / 100);
      const before = g.bal;
      state.wallet -= save; g.bal += save;
      logAct({ kind: 'save', g: gref(g), amt: save, sub: 'auto' });
      msg += R('autoSaved', { pct: state.autoSave.pct, save: fmt(save), goal: label(g) });
      persist(); render();
      showOv('moneyin', { name, amount, saved: save, pct: state.autoSave.pct, goalLabel: label(g), ref: gref(g), before, after: g.bal });
    } else {
      const save = Math.round(amount * 0.1);
      const flex = findGoal('flex') || state.goals[0];
      pending = { type: 'nudge', amount: save, goal: flex };
      msg += R('incomingNudge', { save: fmt(save) });
      persist(); render();
      showOv('moneyin', { name, amount });
    }
    return reply(msg);
  }

  function undoAuto(d) {
    const g = findRef(d.ref);
    if (g && g.bal >= d.saved) { g.bal -= d.saved; state.wallet += d.saved; logAct({ kind: 'move', g: gref(g), amt: d.saved }); }
    persist(); closeOv(); render();
    reply(t('undone', { a: fmt(d.saved) }));
  }

  function resetDemo() {
    const lang = state.lang; stopListening(); stopSpeaking();
    state = seed(); state.lang = lang; pending = null; awaiting = null; lastHeard = ''; lastReply = R('welcome');
    persist(); render(); showOv('onboard', { step: 1 });
  }

  // ---------- speech out ----------
  const backend = { ok: false, sttYo: false, ttsYo: false, ttsEn: false, ttsPcm: false, voiceId: false };
  let audioEl = null, warnedYo = false, speakToken = 0;
  function stopSpeaking() {
    speakToken++;
    try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
    if (audioEl) { audioEl.pause(); audioEl = null; }
  }
  async function speak(text, lang, force) {
    if (!text || (state.muted && !force)) return;
    stopSpeaking();
    const my = speakToken;
    const spoken = L.toSpeech(text, lang);
    const useServer = (lang === 'yo' && backend.ttsYo) || (lang === 'pcm' && backend.ttsPcm) || (lang === 'en' && backend.ttsEn);

        let sum = 0; for (let i = 0; i < buf.length; i++) { const d = (buf[i] - 128) / 128; sum += d * d; }
        if (Math.sqrt(sum / buf.length) > 0.04) { heard = true; lastLoud = Date.now(); }
        if ((heard && Date.now() - lastLoud > 1300) || (!heard && Date.now() - started > 7000)) { if (mr.state === 'recording') mr.stop(); }
      }, 100);
      if (opts.verify) { scorer = voiceScorer(opts.verify); stopTap = pcmTap(ctx, src, scorer.push); }
      mr.addEventListener('stop', () => { clearInterval(vad); if (stopTap) stopTap(); ctx.close(); });
    } catch (e) { heard = true; }
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(tr => tr.stop());
      clearTimeout(stopTimer);
      setLive(false);
      if (mr.discard) return;
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      if (!heard || blob.size < 2000) { emptyRuns++; return emptyRuns < 30 ? afterReply() : status(t('voiceErr')); }
      emptyRuns = 0;
      showListen('work'); busy = true;
      try {
        const lang = state.lang === 'yo' ? 'yo' : 'en';
        const res = await fetch('api/transcribe?lang=' + lang, { method: 'POST', headers: { 'Content-Type': blob.type.split(';')[0] }, body: blob });
        const j = await res.json();
        if (!res.ok || !j.text) throw new Error(j.error || 'no text');
        const voice = scorer ? { score: await scorer.finish() } : null;
        busy = false; showListen(null);
        handle(j.text, { via: 'voice', voice });
      } catch (e) { busy = false; showListen(null); status(t('voiceErr')); afterReply(); }
    };
    mr.start();
    setLive(true);
    stopTimer = setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 15000);
  }

  function startBrowserSR() {
    const r = new SR();
    rec = r;
    r.lang = state.lang === 'yo' ? 'yo-NG' : 'en-NG';
    r.interimResults = true;
    r.maxAlternatives = 1;
    let finalText = '', gotError = false;
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
      }
      $('live-text').textContent = '“' + (finalText + interim).trim() + '”';
    };
    r.onerror = (e) => {
      gotError = true;
      if (['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'].includes(e.error)) { micDenied = true; voiceUnavailable(); }
      else if (e.error !== 'no-speech' && e.error !== 'aborted') status(t('voiceErr'));
    };
    r.onend = () => {
      if (rec === r) rec = null;
      listening = false; $('mic').classList.remove('live'); showListen(null);
      if (finalText.trim()) { emptyRuns = 0; handle(finalText, { via: 'voice' }); return; }
      if (!micDenied && state.handsFree) { emptyRuns++; if (emptyRuns < 30) afterReply(); }
      else if (!gotError) status(t('voiceErr'));
    };
    try { r.start(); setLive(true); } catch (e) { micDenied = true; voiceUnavailable(); }
  }

  function voiceUnavailable() {
    setLive(false); showListen(null);
    showOv('sheet', { tone: 'err', icon: 'micoff', k: t('kMic'), title: t('micTitle'), body: t('micBody'), actions: [
      { label: t('typeInstead'), primary: true, fn: () => { showOv('type'); } },
      { label: t('ok'), fn: closeOv }] });
  }

  $('mic').addEventListener('click', () => {
    if (listening) {
      if (rec) { try { rec.stop(); } catch (e) {} }
      if (mediaRec && mediaRec.state === 'recording') mediaRec.stop();
      return;
    }
    micDenied = false;
    startListening();
  });
  $('stop').addEventListener('click', () => {
    if (rec) { try { rec.stop(); } catch (e) {} }
    if (mediaRec && mediaRec.state === 'recording') mediaRec.stop();
  });
  $('listen-cancel').addEventListener('click', () => { stopListening(); });
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || e.repeat) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (/INPUT|TEXTAREA|BUTTON|SELECT/.test(tag)) return;
    e.preventDefault();
    $('mic').click();
  });

  // ---------- other controls ----------
  $('replay').addEventListener('click', () => speak(lastReply, lastReplyLang, true));
  $('kbd').addEventListener('click', () => showOv('type'));
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));

  // ---------- start ----------
  lastReply = R('welcome');
  render();
  if (!state.onboarded) showOv('onboard', { step: 1 });
  (async () => {
    try {
      const res = await fetch('api/health', { cache: 'no-store' });
      if (!res.ok) return;
      const j = await res.json();
      if (!j || j.service !== 'vosa') return;
      backend.ok = !!j.spitch; backend.sttYo = !!j.spitch; backend.ttsYo = !!j.spitch; backend.ttsEn = !!j.voiceEn; backend.ttsPcm = !!j.spitch; backend.voiceId = !!j.spitch;
      if (state.view === 'settings') render();
    } catch (e) { /* no server: browser-only mode */ }
  })();
})();
</script>
